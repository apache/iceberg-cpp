name: Test

on:
  push:
    branches:
      - main
    tags:
      - '**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '.asf.yaml'
      - '.devcontainer/**'
      - '**/*.md'
      - 'dev/**'
      - 'mkdocs/**'

concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ICEBERG_HOME: /tmp/iceberg

jobs:
  ubuntu:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AMD64 Ubuntu 26.04 (${{ matrix.cmake_build_type }})
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cmake_build_type:
          - Debug
          - RelWithDebInfo
    steps:
      - name: Checkout iceberg-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          key-prefix: sccache-test-ubuntu-${{ matrix.cmake_build_type }}
      - name: Build Iceberg
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: ci/scripts/build_iceberg.sh $(pwd) ON ON OFF OFF ON ${{ matrix.cmake_build_type }}
      - name: Save sccache
        if: always()
        uses: ./.github/actions/save-sccache
        with:
          key-prefix: sccache-test-ubuntu-${{ matrix.cmake_build_type }}
          job-status: ${{ job.status }}
      - name: Build Example
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: ci/scripts/build_example.sh $(pwd)/example
  hive:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AMD64 Ubuntu 26.04 Hive
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: "2G"
      ICEBERG_EXTRA_CMAKE_ARGS: "-DICEBERG_BUILD_HIVE=ON"
    steps:
      - name: Checkout iceberg-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install dependencies
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - name: Restore sccache cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-test-hive-${{ github.run_id }}
          restore-keys: |
            sccache-test-hive-
            sccache-test-ubuntu-
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: Build and test Iceberg with Hive
        shell: bash
        env:
          CC: gcc-14
          CXX: g++-14
        run: ci/scripts/build_iceberg.sh $(pwd) OFF ON
      - name: Show sccache stats
        shell: bash
        run: sccache --show-stats
      - name: Save sccache cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.sccache
          key: sccache-test-hive-${{ github.run_id }}
  macos:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AArch64 macOS 26
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
    steps:
      - name: Checkout iceberg-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          key-prefix: sccache-test-macos
      - name: Build Iceberg
        shell: bash
        run: ci/scripts/build_iceberg.sh $(pwd) OFF ON
      - name: Save sccache
        if: always()
        uses: ./.github/actions/save-sccache
        with:
          key-prefix: sccache-test-macos
          job-status: ${{ job.status }}
      - name: Build Example
        shell: bash
        run: ci/scripts/build_example.sh $(pwd)/example
  windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: AMD64 Windows 2025
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
    steps:
      - name: Checkout iceberg-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Cache vcpkg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: vcpkg-cache
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x64-windows-test-${{ hashFiles('.github/workflows/test.yml') }}
      - name: Install dependencies
        if: ${{ steps.vcpkg-cache.outputs.cache-hit != 'true' }}
        shell: pwsh
        run: |
          vcpkg install zlib:x64-windows nlohmann-json:x64-windows nanoarrow:x64-windows roaring:x64-windows cpr:x64-windows
      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          key-prefix: sccache-test-windows
      - name: Build Iceberg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bash -lc 'ci/scripts/build_iceberg.sh $(pwd) OFF ON'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Save sccache
        if: always()
        uses: ./.github/actions/save-sccache
        with:
          key-prefix: sccache-test-windows
          job-status: ${{ job.status }}
      - name: Build Example
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          bash -lc 'ci/scripts/build_example.sh $(pwd)/example'
  meson:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Meson - ${{ matrix.title }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      max-parallel: 15
      fail-fast: false
      matrix:
        include:
          - title: AMD64 Ubuntu 26.04
            runs-on: ubuntu-26.04
            CC: gcc-14
            CXX: g++-14
            meson-setup-args: -Drest_integration_test=enabled
          - title: AMD64 Windows 2025
            runs-on: windows-2025
            meson-setup-args: --vsenv --buildtype=release --cmake-prefix-path=C:/vcpkg/installed/x64-windows-static-md
          - title: AArch64 macOS 26
            runs-on: macos-26
          - title: AMD64 Ubuntu 26.04, all catalogs and library variants
            runs-on: ubuntu-26.04
            CC: gcc-14
            CXX: g++-14
            sql-clients: true
            benchmarks: true
            meson-setup-args: --default-library=both --buildtype=release -Db_ndebug=true --force-fallback-for=arrow,avro -Dhive=enabled -Dsql_catalog=enabled -Dsql_sqlite=enabled -Dsql_postgresql=enabled -Dsql_mysql=enabled -Dbenchmarks=enabled
          - title: AMD64 Ubuntu 26.04, bundle disabled
            runs-on: ubuntu-26.04
            CC: gcc-14
            CXX: g++-14
            bundle: disabled
            meson-setup-args: -Dbundle=disabled
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Checkout iceberg-cpp
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt
      - name: Set Ubuntu Compilers
        # Wrap the compiler with sccache: Meson auto-detects sccache for the
        # default compiler (macOS/Windows), but uses an explicit CC/CXX verbatim,
        # so the launcher must be prepended here to route Ubuntu compiles through it.
        if: ${{ startsWith(matrix.runs-on, 'ubuntu') }}
        run: |
          echo "CC=sccache ${{ matrix.CC }}" >> $GITHUB_ENV
          echo "CXX=sccache ${{ matrix.CXX }}" >> $GITHUB_ENV
      - name: Install SQL client development packages
        if: ${{ matrix.sql-clients }}
        run: |
          # Match the PostgreSQL packages preinstalled from PGDG on the runner.
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y libsqlite3-dev libpq-dev "postgresql-server-dev-$(pg_config --version | awk '{print $2}' | cut -d. -f1)" default-libmysqlclient-dev libcurl4-openssl-dev libgpg-error-dev libunistring-dev libsasl2-dev libdb-dev
          echo "LIBRARY_PATH=$(pg_config --pkglibdir)" >> "$GITHUB_ENV"
          # Complete the system packages' static link interfaces.
          sudo sed -i '/^Requires.private:/s/$/ libsasl2/' "$(pkg-config --variable=pcfiledir libcurl)/libcurl.pc"
          sudo sed -i '/^Libs.private:/s/$/ -ldb -lsqlite3 -lpq -lmysqlclient/' "$(pkg-config --variable=pcfiledir libsasl2)/libsasl2.pc"
          sudo sed -i 's/-lpgcommon /-lpgcommon_shlib /' "$(pkg-config --variable=pcfiledir libpq)/libpq.pc"
      - name: Install OpenSSL static dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libjitterentropy3-dev
      - name: Install Zlib for CMake subprojects
        if: runner.os == 'Windows'
        run: vcpkg install zlib:x64-windows-static-md
      - name: Set up sccache
        uses: ./.github/actions/setup-sccache
        with:
          key-prefix: sccache-meson-${{ matrix.runs-on }}
      - name: Build Iceberg
        run: |
          meson setup builddir ${{ matrix.meson-setup-args || '' }} --prefix="${{ github.workspace }}/install" --libdir=lib
          meson compile -C builddir
      - name: Save sccache
        if: always()
        uses: ./.github/actions/save-sccache
        with:
          key-prefix: sccache-meson-${{ matrix.runs-on }}
          job-status: ${{ job.status }}
      - name: Test Iceberg
        run: |
          meson test -C builddir --timeout-multiplier 0 --print-errorlogs
      - name: Test installed Meson libraries
        run: python ci/scripts/test_meson_install.py builddir --bundle=${{ matrix.bundle || 'enabled' }}
      - name: Test Meson benchmarks
        if: ${{ matrix.benchmarks }}
        run: meson test -C builddir --benchmark --print-errorlogs
