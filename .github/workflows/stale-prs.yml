# Borrowed the file from Apache Parquet:
# https://github.com/apache/parquet-java/blob/master/.github/workflows/stale-prs.yml

name: Stale pull requests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-slim
    steps:
      - name: Mark and close stale pull requests
        uses: actions/stale@v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Don't touch issues.
          days-before-issue-stale: -1
          days-before-issue-close: -1
          # PRs stale after 1 month of inactivity and closed 1 week later.
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has
            had no activity for at least 1 month. If you are still working on this
            change or plan to move it forward, please leave a comment or push a new
            commit so we know to keep it open. Otherwise, this PR will be closed
            automatically in about one week. Thank you for your contribution to
            Apache Iceberg!
          close-pr-message: >
            Closing this pull request due to at least 1 month of inactivity. If you
            would like to continue the work, please feel free to reopen this pull
            request or open a new one. Thank you for your contribution to
            Apache Iceberg!
